[package]
name = "odjazd-web"
description = "Web app and JSON API for Warsaw departures: nearest poles, live delays and which stop to walk to"
keywords = ["gtfs", "gtfs-realtime", "transit", "warsaw", "pwa"]
categories = ["web-programming::http-server"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
jiff = "0.2.38"
odjazd-core.workspace = true
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.5.0"
