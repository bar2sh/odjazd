[package]
name = "xtask"
description = "Build tasks for the odjazd repository, run with `cargo xtask`"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
brotli = "9.1.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jiff = "0.2.38"
odjazd-core = { workspace = true, features = ["cache"] }
serde_json = "1.0.154"
