[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bar2sh/odjazd"

[workspace.dependencies]
odjazd-core = { path = "crates/odjazd-core", version = "1.0.0" }

# For the WebAssembly build of the map page: smaller and faster to download.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
