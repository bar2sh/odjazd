[package]
name = "odjazd-core"
description = "GTFS and GTFS-Realtime engine behind odjazd: stop search, departure boards with live delays, journey planning"
keywords = ["gtfs", "transit", "timetable", "warsaw"]
categories = ["parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
csv = "1.4.0"
jiff = "0.2.38"
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
rkyv = { version = "0.8.18", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
strsim = "0.11.1"
thiserror = "2.0.21"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Timetable::to_bytes, from_bytes and load_or_build: a timetable saved in binary form.
cache = ["dep:rkyv"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
dirs = "7.0.0"

[[test]]
name = "cache"
required-features = ["cache"]

[[bench]]
name = "warsaw"
harness = false
